name: Build bottle 3D asset

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_sutil_bottle.py'
      - '.github/workflows/build-bottle-model.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model builder
        run: python -m pip install --upgrade pip numpy pillow trimesh
      - name: Build and validate GLB
        run: python scripts/build_sutil_bottle.py
      - name: Commit generated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/garrafa-termica-azul.glb assets/models/textures/blue-powdercoat.jpg assets/models/textures/brushed-stainless.jpg
          if git diff --cached --quiet; then
            echo "Modelo sem mudanças."
          else
            git commit -m "build: gerar malha 3D e texturas PBR da garrafa azul"
            git push
          fi
