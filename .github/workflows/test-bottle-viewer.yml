name: Test bottle 3D viewer

on:
  push:
    branches: [main]
    paths:
      - 'assets/site.js'
      - 'assets/bottle-viewer.js'
      - 'assets/models/**'
      - 'index.html'
      - 'scripts/test-bottle-viewer.mjs'
      - '.github/workflows/test-bottle-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-webgl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Detect browser on runner
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            browser_path="$(command -v "$candidate" || true)"
            if [ -n "$browser_path" ]; then
              echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
              "$browser_path" --version
              exit 0
            fi
          done
          echo "CHROME_BIN=" >> "$GITHUB_ENV"
      - name: Install Chromium fallback
        if: ${{ env.CHROME_BIN == '' }}
        run: npx playwright install --with-deps chromium
      - name: Start local storefront
        run: |
          python -m http.server 4173 > /tmp/sutil-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sutil-http.log
          exit 1
      - name: Test 3D model and live customization
        run: node scripts/test-bottle-viewer.mjs
      - name: Upload 3D test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottle-3d-browser-test
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
