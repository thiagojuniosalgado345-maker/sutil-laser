name: Validate storefront

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < assets/site.js
          node --input-type=module --check < assets/bottle-viewer.js
          node --check assets/admin.js
          node --check config.js
      - name: Validate catalog JSON
        run: python -m json.tool data/catalog.json > /dev/null
      - name: Verify required storefront files
        run: |
          test -f index.html
          test -f admin.html
          test -f assets/site.css
          test -f assets/bottle-viewer.js
          test -f assets/garrafa-azul-sem-nome.jpg
          test -f assets/admin.css
          test -f supabase/SETUP.sql
