name: Expand site bundle

on:
  push:
    branches: [main]
    paths:
      - "site-bundle.b64"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Expand site files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode site-bundle.b64 > /tmp/sutil-laser-site.zip
          mkdir -p /tmp/sutil-laser-site
          unzip -q /tmp/sutil-laser-site.zip -d /tmp/sutil-laser-site
          cp -a /tmp/sutil-laser-site/sutil-laser-site/. .
          rm -rf /tmp/sutil-laser-site /tmp/sutil-laser-site.zip site-bundle.b64

      - name: Commit expanded website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi
          git commit -m "Publica versão revisada do site Sútil Laser"
          git push
